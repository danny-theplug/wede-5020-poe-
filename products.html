<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Products</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <header>
         <nav >
            <table style="width: 100%;">
                <tr>
                  <th><a  href="index.html">Home</a></th>
                  <th><a  href="about.html">About us</a></th>
                  <th><a  href="products.html">Products</a></th>
                  <th><a  href="enquiry.html">Enquiry</a></th>
                  <th><a  href="contact.html">Contact</a></th>
                </tr>
            </table>     
        </nav>
    </header>
   <div class="products-page">
    <main>
        <h1>Buddy D'kota Refreshments products</h1>
        <h2> Cart items: <span id="cartCount">0</span></h2>
     <!--product lists each item will contain name,size and price-->
     <div class="products-container">
         <div class="products-card">
        <section class="product">
         <img src="img/buddy water.jpeg" alt=" picture of water" width="120" height="180">
         <h4>500 ml</h4>
         <p>R16 per bottle</p>
           <button class="add-cart" data-name="500ml water" data-price="16">Add to Cart</button>
        </div>
         <hr>
          <div class="products-card">
        </section>
        <section class="product">
         <img src="img/buddy water.jpeg" alt=" picture of water" width="120" height="180">
          <h4>1L</h4>
          <P>R28 per bottle</P>
          <button class="add-cart" data-name="1L water" data-price="28">Add to Cart</button>
          </div>
          <hr>
     </section>
       <div class="products-card">
     <section class="product">
         <img src="img/buddy water.jpeg" alt=" picture of water" width="120" height="180">
        <h4>2L</h4>
        <p>R35 per bottle</p>
        <button class="add-cart" data-name="2L water" data-price="35">Add to Cart</button>
        </div>
        <hr>
     </section>
     </div>
    </main>
    <button id="checkoutBtn">Checkout</button>
   </div>
    <!--this is where the list of products ends-->
     <div class="modal" id="paymentMethod">
        <div class="modal-content">
            <h2>Payment Method </h2>
            <select id="paymentMethod_select">
                <option>Cash</option>
                <option>Card</option>
                <option>EFT</option>
            </select>
            <h3>Total: R <span id="cartTotal">0</span> </h3>
            <button id="confirmPayment">Confirm Payment</button>
        </div>
        <div role="tablist">
  <button role="tab" data-tab="panel-500ml">500ml</button>
  <button role="tab" data-tab="panel-1l">1L</button>
  <button role="tab" data-tab="panel-2l">2L</button>
</div>

<div id="panel-500ml" role="tabpanel">
  <section class="products-card">
    <section class="product">
      <img src="img/buddy water.jpeg" alt="picture of water" width="120" height="180">
      <h4>500ml</h4>
      <p>R16 per bottle</p>
      <button class="add-cart" data-name="500ml water" data-price="16">Add to Cart</button>
    </section>
  </section>
</div>

<div id="panel-1l" role="tabpanel">
  <!-- your existing 1L card here -->
</div>

<div id="panel-2l" role="tabpanel">
  <!-- your existing 2L card here -->
</div>

     </div>
    <footer>
         <h3>Contact Us</h3>
           <P> Call or text <a href="tel: 0765117777">076-511-7777</a></P> 
           <p> <a href="mailto:buddyd'kotarefreshments@gmail.com">Email Us</a></p>
         <!-- social media icons used as place holders-->
           <p><a href="https://www.instagram.com/buddy.dkota.refreshments?igsh=MW0yczR6dGh2dGE4eg==" class="icons instagram-icon"><i class="fabfa-instagram"></i>Follow us</a></p>

         <p>&copy; 2025 Buddy D'kota Refreshments</p>
    </footer>
    <script src="js/script.js"></script>
</body>
</html>
